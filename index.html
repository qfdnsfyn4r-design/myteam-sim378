<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MyTEAM Sim</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🏀 MyTEAM Sim</h1>

<div class="topbar">
  VC: <span id="vc">0</span>
  <button onclick="manualSave()">Save</button>
</div>

<div class="tabs">
  <button onclick="show('packs')">🎁 Packs</button>
  <button onclick="show('collection')">📦 Collection</button>
  <button onclick="show('market')">🏪 Market</button>
</div>

<div id="packs" class="page"></div>
<div id="collection" class="page" style="display:none"></div>
<div id="market" class="page" style="display:none"></div>

<script src="players.js"></script>
<script src="game.js"></script>

<script>
function show(tab){
  document.querySelectorAll(".page").forEach(p=>p.style.display="none");
  document.getElementById(tab).style.display="block";
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
